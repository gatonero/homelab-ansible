---
- name: Deploy nginx connection_upgrade map
  hosts: nginx_base
  become: true

  tasks:
    - name: Ensure conf.d directory exists
      file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'

    - name: Deploy connection_upgrade map
      copy:
        dest: /etc/nginx/conf.d/00-connection-upgrade-map.conf
        mode: '0644'
        content: |
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
