---
- name: Deploy canonical nginx snippets (ssl-common, proxy-common)
  hosts: nginx_base
  become: true

  tasks:
    - name: Ensure snippets directory exists
      file:
        path: /etc/nginx/snippets
        state: directory
        mode: '0755'

    - name: Deploy ssl-common.conf
      copy:
        dest: /etc/nginx/snippets/ssl-common.conf
        mode: '0644'
        content: |
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;

          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 10m;

    - name: Deploy proxy-common.conf
      copy:
        dest: /etc/nginx/snippets/proxy-common.conf
        mode: '0644'
        content: |
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_buffering off;
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
