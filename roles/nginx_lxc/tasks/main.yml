---
# --------------------------------------------------
# NGINX drop-in structure
# --------------------------------------------------
- name: Ensure NGINX conf.d directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"
  become: true

# --------------------------------------------------
# Disable default NGINX site
# --------------------------------------------------
- name: Remove default NGINX site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: Reload nginx

# --------------------------------------------------
# Reverse proxy vHosts (currently disabled by design)
# --------------------------------------------------
- name: Deploy reverse proxy vHosts
  ansible.builtin.template:
    src: proxy.conf.j2
    dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
    mode: "0644"
  loop: "{{ nginx_proxy_hosts }}"
  when: nginx_proxy_hosts | length > 0
  notify: Reload nginx
  become: true

# --------------------------------------------------
# Cleanup invalid legacy config
# --------------------------------------------------
- name: Remove invalid old performance config
  ansible.builtin.file:
    path: /etc/nginx/conf.d/00-performance.conf
    state: absent
  become: true

# --------------------------------------------------
# NGINX HTTP-level performance tuning (conf.d safe)
# --------------------------------------------------
- name: Deploy NGINX HTTP performance tuning
  ansible.builtin.template:
    src: 99-performance.conf.j2
    dest: /etc/nginx/conf.d/99-performance.conf
    mode: "0644"
  become: true
  notify: Reload nginx

# --------------------------------------------------
# systemd limits for nginx
# --------------------------------------------------
- name: Ensure systemd override directory for nginx exists
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"
  become: true

- name: Set systemd limits for nginx
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/limits.conf
    mode: "0644"
    content: |
      [Service]
      LimitNOFILE=100000
  become: true
  notify:
    - Reload systemd
    - Restart nginx
