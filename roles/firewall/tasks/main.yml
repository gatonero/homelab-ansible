- name: Install nftables
  apt:
    name: nftables
    state: present
    update_cache: yes

- name: Deploy nftables configuration
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Enable and start nftables
  systemd:
    name: nftables
    enabled: yes
    state: started
